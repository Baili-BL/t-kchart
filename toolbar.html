<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tv-chart · 顶部横排工具栏</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    font: 14px -apple-system, "system-ui", "Trebuchet MS", Roboto, Ubuntu, sans-serif;
    background: #f8f9fa; color: #0f0f0f;
  }
  /* 工具栏挂载点：吸顶 */
  #toolbar { flex: 0 0 38px; border-bottom: 1px solid rgb(220,220,220); background: #fff; }
  /* 下方占位图表区，用来验证工具栏悬浮/全屏效果 */
  #stage { flex: 1 1 auto; position: relative; overflow: hidden; }
  #stage .hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #b2b2b2; font-size: 13px; letter-spacing: .08em; pointer-events: none;
  }
  /* 状态回显 */
  #state {
    position: absolute; left: 12px; bottom: 12px; padding: 6px 10px;
    background: #fff; border: 1px solid #e0e0e0; border-radius: 6px;
    font: 12px/1.6 ui-monospace, Consolas, monospace; color: #555;
  }
</style>
</head>
<body>
  <div id="toolbar"></div>
  <div id="stage">
    <div class="hint">图表区域占位 —— 顶部横排工具栏（tv-toolbar）</div>
    <div id="state">点击工具栏按钮，事件会回显在这里</div>
  </div>

  <script type="module">
    import { createToolbar } from './toolbar.js';

    const state = document.getElementById('state');
    const log = (msg) => { state.textContent = msg; };

    createToolbar(document.getElementById('toolbar'), {
      onSymbol:   () => log('事件: onSymbol（打开品种搜索）'),
      onCompare:  () => log('事件: onCompare（比较商品）'),
      onInterval: (label, code) => log(`事件: onInterval → ${label} (${code})`),
      onStyle:    (label) => log(`事件: onStyle → ${label}`),
      onIndicators: () => log('事件: onIndicators（指标、衡量标准和策略）'),
      onAlert:    (on) => log(`事件: onAlert → ${on ? '开启' : '关闭'}`),
      onReplay:   (on) => log(`事件: onReplay → ${on ? '开启' : '关闭'}`),
    });
  </script>
</body>
</html>
