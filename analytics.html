<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tv-chart · 统计组件（收益分布 / 交易分布 / 季节性）</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font: 13px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #131722; background: #f7f8fa;
  }
  body.dark { background: #0e1116; color: #e6edf3; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; }

  #topbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 7px 12px; background: #fff; border-bottom: 1px solid #e0e3eb;
  }
  body.dark #topbar { background: #12161c; border-color: #222b35; }
  #topbar button, #topbar select, #topbar input {
    font: inherit; color: #131722; background: #fff;
    border: 1px solid #d1d4dc; border-radius: 6px; padding: 4px 9px; cursor: pointer;
  }
  body.dark #topbar button, body.dark #topbar select, body.dark #topbar input {
    color: #c9d1d9; background: #161b22; border-color: #26303d;
  }
  #topbar input { width: 62px; cursor: text; }
  #topbar button:hover { background: #f0f3fa; }
  body.dark #topbar button:hover { background: #1d2530; }
  #topbar button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #topbar button.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #topbar .sep { width: 1px; height: 18px; background: #e0e3eb; margin: 0 2px; }
  body.dark #topbar .sep { background: #26303d; }
  .hint { color: #787b86; font: 11px/1.5 ui-monospace, Consolas, monospace; }

  #grid {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: 10px; padding: 10px;
  }
  .card {
    position: relative; min-width: 0; min-height: 0;
    background: #fff; border: 1px solid #e0e3eb; border-radius: 10px;
    overflow: hidden;
  }
  body.dark .card { background: #131722; border-color: #222b35; }
  .card.wide { grid-column: 1 / -1; }
  .card canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #status {
    flex: 0 0 auto; font: 11px/1.5 ui-monospace, Consolas, monospace;
    color: #787b86; background: #fff; padding: 4px 12px;
    border-top: 1px solid #e0e3eb; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  body.dark #status { background: #0b0e13; border-color: #222b35; }
  #status.bad { color: #f23645; background: #ffe9eb; white-space: pre-wrap; }

  #logwrap { position: absolute; left: 12px; bottom: 30px; width: min(700px, calc(100% - 24px)); }
  #logbar {
    font: 11px/1.6 ui-monospace, Consolas, monospace; color: #787b86;
    background: rgba(255,255,255,.94); border: 1px solid #d1d4dc;
    border-radius: 6px; padding: 2px 8px; cursor: pointer; user-select: none;
  }
  body.dark #logbar { background: rgba(22,27,34,.94); border-color: #26303d; color: #8b949e; }
  #log {
    font: 11px/1.55 ui-monospace, Consolas, monospace; color: #5d606b;
    background: rgba(255,255,255,.98); border: 1px solid #d1d4dc; border-top: none;
    border-radius: 0 0 6px 6px; padding: 6px 8px; overflow: auto;
    max-height: 170px; white-space: pre-wrap; word-break: break-all;
  }
  body.dark #log { background: rgba(13,17,23,.96); border-color: #26303d; color: #7d8590; }
  #logwrap.collapsed #log { display: none; }
</style>

<script>
(function () {
  window.__diag = function (msg, isErr) {
    var text = String(msg);
    try { (isErr ? console.error : console.log)(text); } catch (e) {}
    var l = document.getElementById('log');
    if (l) {
      var d = document.createElement('div');
      d.textContent = text;
      if (isErr) d.style.color = '#f23645';
      l.appendChild(d);
      l.scrollTop = l.scrollHeight;
    }
    if (isErr) {
      var s = document.getElementById('status');
      if (s) { s.textContent = text; s.className = 'bad'; }
    }
  };
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target !== window && e.target.tagName) {
      window.__diag('✗ 资源加载失败：<' + e.target.tagName.toLowerCase() + '> ' +
        (e.target.src || e.target.href || ''), true);
    } else {
      window.__diag('✗ JS 错误：' + (e && e.message ? e.message : e) +
        (e && e.lineno ? '  @' + e.lineno + ':' + e.colno : ''), true);
    }
  }, true);
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      var s = document.getElementById('status');
      if (s && /^booting/.test(s.textContent)) {
        window.__diag('✗ 2 秒内没启动起来。protocol=' + location.protocol +
          '  typeof ReturnsChart=' + (typeof ReturnsChart), true);
      }
    }, 2000);
  });
})();
</script>
</head>
<body>
<div id="app">
  <div id="topbar">
    <select id="sym"></select>
    <span class="sep"></span>
    <label class="hint">快线</label><input id="fast" type="number" value="5" min="1" max="120">
    <label class="hint">慢线</label><input id="slow" type="number" value="20" min="2" max="250">
    <button id="run" class="primary">运行 ▸</button>
    <span class="sep"></span>
    <button id="theme">深色</button>
    <button id="test">自检</button>
    <span class="sep"></span>
    <span class="hint">数据来自双均线回测（equity.ts 的 simulateMaCross）</span>
  </div>

  <div id="grid">
    <div class="card wide"><canvas id="c-returns"></canvas></div>
    <div class="card"><canvas id="c-donut"></canvas></div>
    <div class="card"><canvas id="c-season"></canvas></div>
  </div>

  <div id="status">booting…</div>
</div>

<div id="logwrap" class="collapsed">
  <div id="logbar">运行日志（点开）· 始终写入 DOM，供 --dump-dom 抓取</div>
  <div id="log"></div>
</div>

<script src="chart.js"></script>
<script src="grid.js"></script>
<script src="equity.js"></script>
<script src="analytics.js"></script>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  if (typeof ReturnsChart !== 'function' || typeof DonutChart !== 'function' ||
      typeof SeasonalsChart !== 'function' || typeof simulateMaCross !== 'function') {
    window.__diag('✗ 脚本没加载成功', true);
    return;
  }
  window.__diag('✓ 已加载  protocol=' + location.protocol, false);

  document.getElementById('logbar').addEventListener('click', function () {
    document.getElementById('logwrap').classList.toggle('collapsed');
  });

  var symSel = document.getElementById('sym');
  SYMBOLS.forEach(function (s) {
    var o = document.createElement('option');
    o.value = s.ticker;
    o.textContent = s.ticker + '  ' + s.name;
    symSel.appendChild(o);
  });
  var ticker = SYMBOLS[0].ticker;
  var themeName = 'light';

  var rc = new ReturnsChart('#c-returns', [], {
    title: '收益分布', theme: themeName, binCount: 10,
  });
  var dn = new DonutChart('#c-donut', [], {
    title: '交易分布', theme: themeName, centerLabel: '总交易数',
  });
  var sn = new SeasonalsChart('#c-season', [], {
    title: '季节性（年内累计收益）', theme: themeName, asPercent: true,
  });
  window.__charts = { returns: rc, donut: dn, season: sn };

  function money(v) { return fmtMoney(v, 2, true); }

  /* ------------------------------------------------------------ 运行 */
  function run() {
    var fast = parseInt(document.getElementById('fast').value, 10) || 5;
    var slow = parseInt(document.getElementById('slow').value, 10) || 20;
    if (slow <= fast) { slow = fast + 1; document.getElementById('slow').value = String(slow); }

    var bars = dailyFor(ticker);
    var bt = simulateMaCross(bars, fast, slow, 100000);
    var wl = avgWinLoss(bt.tradeReturns);

    // ---- 收益分布 ----
    rc.setData(bt.tradeReturns, wl.avgLoss, wl.avgProfit);
    rc.o.leftStat = [{
      text: (bt.netProfit >= 0 ? '+' : '') + money(bt.netProfit) + ' USD',
      right: (bt.netProfit / 100000 * 100).toFixed(2) + '%',
      color: bt.netProfit >= 0 ? '#089981' : '#f23645',
    }];
    rc.o.rightStat = [{
      text: money(bt.maxDrawdown) + ' USD',
      right: '-' + (bt.maxDrawdown / 100000 * 100).toFixed(2) + '%',
      color: '#f23645',
    }];
    rc.o.binCount = 10;
    // 分箱范围按数据自适应，避免极端值把其它箱压扁
    rc.invalidate();

    // ---- 交易分布 ----
    dn.setData([
      { label: '盈利', value: wl.winners.length, color: '#089981' },
      { label: '亏损', value: wl.losers.length, color: '#f23645' },
      { label: '平局', value: wl.breakevens.length, color: '#ff9800' },
    ]);
    dn.o.highlight = wl.losers.length >= wl.winners.length ? 1 : 0;
    dn.hoverSlice = dn.o.highlight;

    // ---- 季节性 ----
    sn.setData(seasonalSeries(bars));
    sn.o.header = ticker;

    rc.drawNow(); dn.drawNow(); sn.drawNow();
    report(bt, wl);
  }
  window.__run = run;

  function report(bt, wl) {
    statusEl.className = '';
    statusEl.textContent =
      ticker + '  MA(' + document.getElementById('fast').value + ',' +
      document.getElementById('slow').value + ')' +
      '  |  净利 ' + money(bt.netProfit) +
      '  回撤 ' + money(bt.maxDrawdown) +
      '  笔数 ' + bt.tradeCount +
      '  胜率 ' + (bt.winRate * 100).toFixed(1) + '%' +
      '  |  ' + rc.debugInfo() +
      '  ||  ' + dn.debugInfo() +
      '  ||  ' + sn.debugInfo();
  }

  /* ------------------------------------------------------------ 顶栏 */
  document.getElementById('topbar').addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!btn) return;
    if (btn.id === 'run') {
      run();
    } else if (btn.id === 'theme') {
      themeName = themeName === 'light' ? 'dark' : 'light';
      document.body.classList.toggle('dark', themeName === 'dark');
      rc.setTheme(themeName); dn.setTheme(themeName); sn.setTheme(themeName);
      btn.textContent = themeName === 'light' ? '深色' : '浅色';
      btn.classList.toggle('on', themeName === 'dark');
      rc.drawNow(); dn.drawNow(); sn.drawNow();
    } else if (btn.id === 'test') {
      runTest();
    }
  });
  symSel.addEventListener('change', function () { ticker = symSel.value; run(); });

  window.addEventListener('resize', function () {
    rc.resize(); dn.resize(); sn.resize();
  });

  /* ------------------------------------------------------------ 自检 */
  function runTest() {
    log('--- 统计组件自检 ---');
    var a;
    try {
      a = analyticsSelfTest();
    } catch (e) {
      window.__diag('✗ 统计组件自检抛异常：' + (e && e.stack ? e.stack : e), true);
      return;
    }
    var tail = 'ANATEST pass=' + a.pass + ' fail=' + a.fail;
    document.title = tail;
    log(tail);
    return a;
  }
  window.__selftest = runTest;

  /* ------------------------------------------------------------ 启动 */
  try {
    run();
  } catch (e) {
    window.__diag('✗ 启动失败：' + (e && e.stack ? e.stack : e), true);
    return;
  }

  // ⚠️ 加 setTimeout 兜底：后台标签页 / headless 里 rAF 可能不触发
  var started = false;
  function autostart() {
    if (started) return;
    started = true;
    runTest();
    log('READY 统计页就绪');
  }
  requestAnimationFrame(function () { requestAnimationFrame(autostart); });
  setTimeout(autostart, 400);
})();
</script>
</body>
</html>
