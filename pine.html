<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tv-chart · Pine v5 子集引擎</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1116; }
  body { font: 12px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #e6edf3; }
  #app { position: absolute; inset: 0; display: flex; }

  /* ------------------------------------------------------ 左：编辑器 */
  #side {
    flex: 0 0 330px; width: 330px; display: flex; flex-direction: column;
    background: #12161c; border-right: 1px solid #222b35; padding: 8px;
  }
  .sec-h {
    font-size: 11px; letter-spacing: .12em; color: #6e7681;
    text-transform: uppercase; margin: 6px 0 6px;
  }
  #src {
    flex: 1; min-height: 200px; resize: none;
    font: 12px/1.6 ui-monospace, Consolas, "Courier New", monospace;
    color: #c9d1d9; background: #0b0e13;
    border: 1px solid #26303d; border-radius: 6px;
    padding: 8px; outline: none; tab-size: 4; white-space: pre; overflow: auto;
  }
  #src:focus { border-color: #1f6feb; }
  .btns { display: flex; gap: 6px; margin: 8px 0; }
  .btns button {
    flex: 1; font: inherit; color: #c9d1d9; background: #161b22;
    border: 1px solid #26303d; border-radius: 6px; padding: 6px 9px; cursor: pointer;
  }
  .btns button:hover { background: #1d2530; border-color: #3a4654; }
  .btns button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .samples { display: flex; flex-wrap: wrap; gap: 5px; }
  .samples button {
    font: 11px/1 inherit; color: #9aa4b2; background: #161b22;
    border: 1px solid #26303d; border-radius: 5px; padding: 5px 8px; cursor: pointer;
  }
  .samples button:hover { background: #1d2530; color: #fff; }
  .muted { color: #6e7681; font: 11px/1.6 ui-monospace, Consolas, monospace; }

  /* ---------------------------------------------------- 中：图表 */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #toolbar {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 6px 8px; background: #12161c; border-bottom: 1px solid #222b35;
  }
  #toolbar button, #toolbar select {
    font: inherit; color: #c9d1d9; background: #161b22;
    border: 1px solid #26303d; border-radius: 6px;
    padding: 4px 9px; cursor: pointer;
  }
  #toolbar button:hover, #toolbar select:hover { background: #1d2530; border-color: #3a4654; }
  #toolbar button.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #toolbar .sep { width: 1px; height: 18px; background: #26303d; margin: 0 2px; }
  #chartwrap { flex: 1; min-height: 0; position: relative; }
  #chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #rangebar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 1px;
    padding: 2px 8px; background: #12161c; border-top: 1px solid #222b35;
  }
  #rangebar button {
    font: 11px/1 ui-monospace, Consolas, monospace; color: #9aa4b2;
    background: transparent; border: 1px solid transparent; border-radius: 4px;
    padding: 4px 8px; cursor: pointer;
  }
  #rangebar button:hover { background: #1d2530; color: #fff; }
  #rangebar button.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #rangebar button.off { opacity: .28; cursor: default; }
  #rangebar button.off:hover { background: transparent; color: #9aa4b2; }
  #rangebar .sep { width: 1px; height: 13px; background: #26303d; margin: 0 5px; }
  #rangeInfo { margin-left: auto; }

  #status {
    flex: 0 0 auto; font: 11px/1.5 ui-monospace, Consolas, monospace;
    color: #6e7681; background: #0b0e13; padding: 3px 8px;
    border-top: 1px solid #222b35; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  #status.bad { color: #ff7b72; background: #2a1113; white-space: pre-wrap; }

  /* -------------------------------------------------- 右：数据窗口 */
  #win {
    flex: 0 0 210px; width: 210px; overflow-y: auto;
    background: #12161c; border-left: 1px solid #222b35; padding: 8px;
  }
  table.win { width: 100%; border-collapse: collapse; font: 11px/1.6 ui-monospace, Consolas, monospace; }
  table.win td { padding: 1px 0; vertical-align: top; }
  table.win td:first-child { color: #6e7681; padding-right: 6px; }
  table.win td:last-child { text-align: right; color: #c9d1d9; }
  .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

  #logwrap { position: absolute; left: 342px; bottom: 54px; width: min(660px, calc(100% - 580px)); }
  #logbar {
    font: 11px/1.6 ui-monospace, Consolas, monospace; color: #8b949e;
    background: rgba(22,27,34,.92); border: 1px solid #26303d;
    border-radius: 6px; padding: 2px 8px; cursor: pointer; user-select: none;
  }
  #log {
    font: 11px/1.55 ui-monospace, Consolas, monospace; color: #7d8590;
    background: rgba(13,17,23,.95); border: 1px solid #26303d; border-top: none;
    border-radius: 0 0 6px 6px; padding: 6px 8px; overflow: auto;
    max-height: 180px; white-space: pre-wrap; word-break: break-all;
  }
  #logwrap.collapsed #log { display: none; }
</style>

<script>
(function () {
  window.__diag = function (msg, isErr) {
    var text = String(msg);
    try { (isErr ? console.error : console.log)(text); } catch (e) {}
    var l = document.getElementById('log');
    if (l) {
      var d = document.createElement('div');
      d.textContent = text;
      if (isErr) d.style.color = '#ff7b72';
      l.appendChild(d);
      l.scrollTop = l.scrollHeight;
    }
    if (isErr) {
      var s = document.getElementById('status');
      if (s) { s.textContent = text; s.className = 'bad'; }
    }
  };
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target !== window && e.target.tagName) {
      window.__diag('✗ 资源加载失败：<' + e.target.tagName.toLowerCase() + '> ' +
        (e.target.src || e.target.href || ''), true);
    } else {
      window.__diag('✗ JS 错误：' + (e && e.message ? e.message : e) +
        (e && e.lineno ? '  @' + e.lineno + ':' + e.colno : ''), true);
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    window.__diag('✗ 未处理的 Promise 拒绝：' + (r && r.stack ? r.stack : r), true);
  });
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      var s = document.getElementById('status');
      if (s && /^booting/.test(s.textContent)) {
        window.__diag('✗ 2 秒内没启动起来。protocol=' + location.protocol +
          '  typeof PineEngine=' + (typeof PineEngine), true);
      }
    }, 2000);
  });
})();
</script>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="sec-h">Pine 脚本（v5 子集）</div>
    <textarea id="src" spellcheck="false"></textarea>
    <div class="btns">
      <button id="run" class="primary">运行 ▸</button>
      <button id="test">引擎自检</button>
    </div>
    <div class="sec-h">示例</div>
    <div class="samples" id="samples"></div>
    <div class="sec-h">这个引擎不做什么</div>
    <div class="muted">
      只支持 <b>indicator</b>，不支持 <b>strategy</b> 撮合。<br>
      不支持数组 / table / label / request。<br>
      遇到没实现的会<b>明确报错</b>，不会静默给 na。
    </div>
  </aside>

  <main id="main">
    <div id="toolbar">
      <select id="sym"></select>
      <button data-tf="1D" class="on">1D</button>
      <button data-tf="1W">1W</button>
      <button data-tf="1M">1M</button>
      <span class="sep"></span>
      <button id="theme">浅色</button>
      <span class="sep"></span>
      <span id="proginfo" class="muted"></span>
    </div>
    <div id="chartwrap"><canvas id="chart"></canvas></div>
    <div id="rangebar"></div>
    <div id="status">booting…</div>
  </main>

  <aside id="win">
    <div class="sec-h">输出线（plot）</div>
    <table class="win" id="winPlots"></table>
    <div class="sec-h">变量（最后一根）</div>
    <table class="win" id="winVars"></table>
    <div class="sec-h">标记（plotshape）</div>
    <table class="win" id="winMarks"></table>
  </aside>
</div>

<div id="logwrap" class="collapsed">
  <div id="logbar">运行日志（点开）· 始终写入 DOM，供 --dump-dom 抓取</div>
  <div id="log"></div>
</div>

<!-- 顺序不能反：grid 依赖 chart，pine 依赖 chart -->
<script src="chart.js"></script>
<script src="grid.js"></script>
<script src="pine.js"></script>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  if (typeof TVChart !== 'function' || typeof PineEngine !== 'function') {
    window.__diag('✗ 脚本没加载成功（TVChart=' + (typeof TVChart) +
      '  PineEngine=' + (typeof PineEngine) + '）', true);
    return;
  }
  window.__diag('✓ 已加载  protocol=' + location.protocol, false);

  document.getElementById('logbar').addEventListener('click', function () {
    document.getElementById('logwrap').classList.toggle('collapsed');
  });

  /* ------------------------------------------------------------ 示例 */
  var SAMPLES = [
    {
      name: 'MA 交叉',
      code: [
        '//@version=5',
        'indicator("MA 交叉", overlay=true)',
        '',
        'fast = input.int(5, "快线")',
        'slow = input.int(20, "慢线")',
        '',
        'maFast = ta.sma(close, fast)',
        'maSlow = ta.sma(close, slow)',
        '',
        'plot(maFast, "MA快", color=color.yellow, linewidth=2)',
        'plot(maSlow, "MA慢", color=color.blue, linewidth=2)',
        '',
        'up = ta.crossover(maFast, maSlow)',
        'dn = ta.crossunder(maFast, maSlow)',
        'plotshape(up, title="金叉", style=shape.triangleup, location=location.belowbar, color=color.green, text="买")',
        'plotshape(dn, title="死叉", style=shape.triangledown, location=location.abovebar, color=color.red, text="卖")'
      ].join('\n')
    },
    {
      name: '布林带',
      code: [
        '//@version=5',
        'indicator("布林带 BB", overlay=true)',
        '',
        'len = input.int(20, "周期")',
        'mult = input.float(2.0, "倍数")',
        '',
        '[basis, upper, lower] = ta.bb(close, len, mult)',
        '',
        'plot(basis, "中轨", color=color.gray, linewidth=2)',
        'plot(upper, "上轨", color=color.red)',
        'plot(lower, "下轨", color=color.green)',
        '',
        'width = (upper - lower) / basis * 100',
        'hline(0, "零轴")'
      ].join('\n')
    },
    {
      name: 'RSI',
      code: [
        '//@version=5',
        'indicator("RSI", overlay=false)',
        '',
        'len = input.int(14, "周期")',
        'r = ta.rsi(close, len)',
        '',
        'plot(r, "RSI", color=color.purple, linewidth=2)',
        'plot(70, "超买", color=color.red)',
        'plot(30, "超卖", color=color.green)',
        '',
        'plotshape(ta.crossover(r, 70), title="超买", location=location.abovebar, color=color.red, text="O")',
        'plotshape(ta.crossunder(r, 30), title="超卖", location=location.belowbar, color=color.green, text="X")'
      ].join('\n')
    },
    {
      name: 'ATR 通道',
      code: [
        '//@version=5',
        'indicator("ATR 通道", overlay=true)',
        '',
        'len = input.int(14, "ATR 周期")',
        'k = input.float(2.0, "倍数")',
        '',
        'a = ta.atr(len)',
        'mid = ta.sma(close, 20)',
        '',
        'plot(mid, "中轨", color=color.blue, linewidth=2)',
        'plot(mid + k * a, "上轨", color=color.red)',
        'plot(mid - k * a, "下轨", color=color.green)',
        '',
        'ema20 = ta.ema(close, 20)',
        'plot(ema20, "EMA20", color=color.orange)'
      ].join('\n')
    },
    {
      name: 'MACD 柱',
      code: [
        '//@version=5',
        'indicator("MACD", overlay=false)',
        '',
        '[macdLine, signalLine, hist] = ta.macd(close, 12, 26, 9)',
        '',
        'plot(macdLine, "MACD", color=color.blue, linewidth=2)',
        'plot(signalLine, "Signal", color=color.orange)',
        'plot(hist, "Hist", color=color.gray)',
        'hline(0, "零轴", color=color.gray)'
      ].join('\n')
    }
  ];

  var srcEl = document.getElementById('src');
  srcEl.value = SAMPLES[0].code;
  var samplesEl = document.getElementById('samples');
  SAMPLES.forEach(function (s) {
    var b = document.createElement('button');
    b.textContent = s.name;
    b.addEventListener('click', function () {
      srcEl.value = s.code;
      runScript();
    });
    samplesEl.appendChild(b);
  });

  /* -------------------------------------------------------------- 数据 */
  var symSel = document.getElementById('sym');
  SYMBOLS.forEach(function (s) {
    var o = document.createElement('option');
    o.value = s.ticker;
    o.textContent = s.ticker + '  ' + s.name;
    symSel.appendChild(o);
  });

  var chart = null;
  var engine = null;
  var ticker = SYMBOLS[0].ticker;
  var tf = '1D';
  var themeName = 'dark';

  try {
    chart = new TVChart('#chart', resample(dailyFor(ticker), tf), {
      symbol: ticker,
      timeframe: tf,
      legendInset: 12
    });
    chart.setTheme(themeName);
  } catch (e) {
    window.__diag('✗ 初始化图表失败：' + (e && e.stack ? e.stack : e), true);
    return;
  }
  window.__chart = chart;

  /* ------------------------------------------------------ 运行脚本 */
  function runScript() {
    var code = srcEl.value;
    var t0 = Date.now();
    try {
      engine = new PineEngine(code, chart.bars, { symbol: ticker, timeframe: tf });
      engine.run();
    } catch (e) {
      var msg = (e && e.message) ? e.message : String(e);
      statusEl.className = 'bad';
      statusEl.textContent = '✗ ' + msg;
      log('✗ 脚本错误：' + msg);
      document.getElementById('proginfo').textContent = '';
      renderWindow(null);
      return false;
    }
    engine.applyTo(chart);
    var ms = Date.now() - t0;
    statusEl.className = '';
    // ⚠️ 成功时**必须**改掉 "booting…"，否则 2 秒看门狗会误报「没启动起来」
    statusEl.textContent = '✓ ' + engine.kind + ' "' + engine.title + '"' +
      '  ·  ' + chart.bars.length + ' bars' +
      '  ·  ' + engine.plots.length + ' 线 / ' + engine.marks.length + ' 组标记' +
      '  ·  ' + ms + 'ms';
    document.getElementById('proginfo').textContent =
      engine.kind + ' · ' + chart.bars.length + ' bars · ' + ms + 'ms';
    log('✓ 运行成功  ' + engine.summary() + '  ' + ms + 'ms');
    renderWindow(engine);
    return true;
  }
  window.__run = runScript;

  /* -------------------------------------------------------- 数据窗口 */
  var SKIP = {
    open: 1, high: 1, low: 1, close: 1, volume: 1, time: 1, time_close: 1,
    hl2: 1, hlc3: 1, ohlc4: 1, hlcc4: 1, year: 1, month: 1, dayofmonth: 1,
    dayofweek: 1, hour: 1, minute: 1, bar_index: 1, last_bar_index: 1
  };

  function fmtNum(v) {
    if (v === null || v === undefined) return 'na';
    if (typeof v === 'number') {
      if (!isFinite(v)) return 'na';
      return Math.abs(v) >= 1000 ? v.toFixed(2) : v.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
    }
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    return String(v);
  }

  function renderWindow(eng) {
    var plots = document.getElementById('winPlots');
    var vars = document.getElementById('winVars');
    var marks = document.getElementById('winMarks');
    plots.innerHTML = '';
    vars.innerHTML = '';
    marks.innerHTML = '';

    if (!eng) return;

    eng.plots.forEach(function (p) {
      var last = null;
      for (var i = p.values.length - 1; i >= 0; i--) {
        if (p.values[i] !== null && p.values[i] !== undefined) { last = p.values[i]; break; }
      }
      var tr = document.createElement('tr');
      tr.innerHTML = '<td><span class="swatch" style="background:' + p.color + '"></span>' +
        escapeHtml(p.title) + '</td><td>' + fmtNum(last) + '</td>';
      plots.appendChild(tr);
    });

    eng.hlines.forEach(function (h) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td><span class="swatch" style="background:' + h.color + '"></span>' +
        escapeHtml(h.title) + '</td><td>' + fmtNum(h.price) + '</td>';
      plots.appendChild(tr);
    });

    var snap = eng.snapshot();
    Object.keys(snap).sort().forEach(function (k) {
      if (SKIP[k]) return;
      var v = snap[k];
      if (Array.isArray(v)) v = '[' + v.map(fmtNum).join(', ') + ']';
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + escapeHtml(k) + '</td><td>' + escapeHtml(fmtNum(v)) + '</td>';
      vars.appendChild(tr);
    });

    eng.marks.forEach(function (m) {
      var n = 0;
      for (var i = 0; i < m.marks.length; i++) if (m.marks[i] !== undefined) n++;
      var tr = document.createElement('tr');
      tr.innerHTML = '<td><span class="swatch" style="background:' + m.color + '"></span>' +
        escapeHtml(m.title) + '</td><td>' + n + ' 个</td>';
      marks.appendChild(tr);
    });
    if (!eng.marks.length) {
      marks.innerHTML = '<tr><td colspan="2" style="color:#6e7681">（无）</td></tr>';
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------------------------------------------------------- 范围条 */
  var rangebar = document.getElementById('rangebar');
  var rangeEls = {};
  RANGES.forEach(function (r) {
    if (r.key === 'ALL') {
      var sp = document.createElement('span');
      sp.className = 'sep';
      rangebar.appendChild(sp);
    }
    var b = document.createElement('button');
    b.textContent = r.label;
    b.dataset.range = r.key;
    rangebar.appendChild(b);
    rangeEls[r.key] = b;
  });
  var rangeInfo = document.createElement('span');
  rangeInfo.id = 'rangeInfo';
  rangeInfo.className = 'muted';
  rangebar.appendChild(rangeInfo);

  rangebar.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button[data-range]') : null;
    if (!b) return;
    chart.setRange(b.dataset.range);
    refreshRange();
  });

  function computeActiveRange(c) {
    var vt = c.viewTimes();
    if (!vt) return null;
    var first = c.bars[0].time;
    var last = c.bars[c.bars.length - 1].time;
    var all = last - first;
    var span = vt[1] - vt[0];
    if (all > 0 && span >= all * 0.97) return 'ALL';
    var ytd = new Date(new Date(last).getFullYear(), 0, 1).getTime();
    if (Math.abs(vt[0] - ytd) < 86400000 * 7) return 'YTD';
    var best = null;
    var bestErr = 1e9;
    for (var i = 0; i < RANGES.length; i++) {
      var r = RANGES[i];
      if (r.ms == null) continue;
      var err = Math.abs(Math.log((span || 1) / r.ms));
      if (err < bestErr) { bestErr = err; best = r.key; }
    }
    return bestErr < Math.log(1.6) ? best : null;
  }

  function refreshRange() {
    for (var i = 0; i < RANGES.length; i++) {
      var k = RANGES[i].key;
      rangeEls[k].classList.toggle('off', !chart.rangeAvailable(k));
    }
    var act = computeActiveRange(chart);
    Object.keys(rangeEls).forEach(function (k) {
      rangeEls[k].classList.toggle('on', k === act);
    });
    rangeInfo.textContent = (chart.viewSpan() / 86400000).toFixed(0) + 'd span';
  }

  /* ---------------------------------------------------------- 工具栏 */
  document.getElementById('toolbar').addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!btn) return;
    var t = btn.dataset.tf;
    if (t) {
      tf = t;
      var tfs = document.querySelectorAll('[data-tf]');
      for (var i = 0; i < tfs.length; i++) tfs[i].classList.toggle('on', tfs[i] === btn);
      reload();
    } else if (btn.id === 'theme') {
      themeName = themeName === 'dark' ? 'light' : 'dark';
      chart.setTheme(themeName);
      btn.textContent = themeName === 'dark' ? '浅色' : '深色';
      btn.classList.toggle('on', themeName === 'light');
    }
  });
  symSel.addEventListener('change', function () {
    ticker = symSel.value;
    reload();
  });

  function reload() {
    chart.setBars(resample(dailyFor(ticker), tf), { symbol: ticker, timeframe: tf });
    refreshRange();
    runScript();
  }

  document.getElementById('run').addEventListener('click', function () { runScript(); });
  document.getElementById('test').addEventListener('click', function () {
    log('--- Pine 引擎自检 ---');
    var r;
    try {
      r = pineSelfTest();
    } catch (e) {
      window.__diag('✗ 自检抛异常：' + (e && e.stack ? e.stack : e), true);
      return;
    }
    document.title = 'PINETEST pass=' + r.pass + ' fail=' + r.fail;
    log('PINETEST pass=' + r.pass + ' fail=' + r.fail);
  });
  window.__pinetest = pineSelfTest;

  window.addEventListener('resize', refreshRange);

  /* ---------------------------------------------------------- 启动 */
  try {
    chart.drawNow();
    runScript();
    chart.showLast(180);
  } catch (e) {
    window.__diag('✗ 启动失败：' + (e && e.stack ? e.stack : e), true);
    return;
  }
  refreshRange();

  // 自动跑一遍引擎自检，让 headless --dump-dom 能直接判定。
  // ⚠️ 加 setTimeout 兜底：后台标签页 / headless 里 rAF 可能不触发。
  var started = false;
  function autostart() {
    if (started) return;
    started = true;
    log('--- Pine 引擎自检 ---');
    try {
      var r = pineSelfTest();
      document.title = 'PINETEST pass=' + r.pass + ' fail=' + r.fail;
      log('PINETEST pass=' + r.pass + ' fail=' + r.fail);
    } catch (e) {
      window.__diag('✗ 自检抛异常：' + (e && e.stack ? e.stack : e), true);
      return;
    }
    log('READY pine 页面就绪');
  }
  requestAnimationFrame(function () {
    requestAnimationFrame(autostart);
  });
  setTimeout(autostart, 400);
})();
</script>
</body>
</html>
