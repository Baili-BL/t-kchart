<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tv-chart · 右侧边栏工具条</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; overflow: hidden;
    font: 14px -apple-system, "system-ui", "Trebuchet MS", Roboto, Ubuntu, sans-serif;
    background: #f8f9fa; color: #0f0f0f;
  }
  /* 右侧工具条挂载点：贴右、占满高 */
  #rightbar {
    flex: 0 0 45px; display: flex; justify-content: flex-end;
    border-left: 1px solid rgb(235,235,235); background: #fff;
  }
  #rightbar > div { height: 100%; }
  /* 左侧占位图表区 */
  #stage { flex: 1 1 auto; position: relative; overflow: hidden; }
  #stage .hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #b2b2b2; font-size: 13px; letter-spacing: .08em; pointer-events: none;
  }
  /* 状态回显 */
  #state {
    position: absolute; left: 12px; bottom: 12px; padding: 6px 10px;
    background: #fff; border: 1px solid #e0e0e0; border-radius: 6px;
    font: 12px/1.6 ui-monospace, Consolas, monospace; color: #555;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="hint">图表区域占位 —— 右侧边栏工具条（tv-rightbar）</div>
    <div id="state">点击按钮切换面板，再次点击收起；事件回显在这里</div>
  </div>
  <div id="rightbar"></div>

  <script type="module">
    import { createRightbar } from './rightbar.js';

    const state = document.getElementById('state');
    const log = (msg) => { state.textContent = msg; };

    createRightbar(document.getElementById('rightbar'), {
      onSelect: (label, on) => log(`事件: onSelect → ${label} ${on ? '展开' : '收起'}`),
    });
  </script>
</body>
</html>
