<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tv-chart · 权益曲线（Strategy Tester）</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1116; }
  body { font: 12px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #e6edf3; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; }

  #topbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 6px 8px; background: #12161c; border-bottom: 1px solid #222b35;
  }
  #topbar button, #topbar select, #topbar input {
    font: inherit; color: #c9d1d9; background: #161b22;
    border: 1px solid #26303d; border-radius: 6px; padding: 4px 9px; cursor: pointer;
  }
  #topbar input { width: 62px; cursor: text; }
  #topbar button:hover, #topbar select:hover { background: #1d2530; border-color: #3a4654; }
  #topbar button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #topbar button.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #topbar .sep { width: 1px; height: 18px; background: #26303d; margin: 0 2px; }
  #topbar label { color: #6e7681; }
  .hint { color: #6e7681; font: 11px/1.5 ui-monospace, Consolas, monospace; }

  #chartwrap { flex: 1; min-height: 0; position: relative; }
  #chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #rangebar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 1px;
    padding: 2px 8px; background: #12161c; border-top: 1px solid #222b35;
  }
  #rangebar button {
    font: 11px/1 ui-monospace, Consolas, monospace; color: #9aa4b2;
    background: transparent; border: 1px solid transparent; border-radius: 4px;
    padding: 4px 8px; cursor: pointer;
  }
  #rangebar button:hover { background: #1d2530; color: #fff; }
  #rangebar button.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #rangebar button.off { opacity: .28; cursor: default; }
  #rangebar button.off:hover { background: transparent; color: #9aa4b2; }
  #rangebar .sep { width: 1px; height: 13px; background: #26303d; margin: 0 5px; }
  #rangeInfo { margin-left: auto; }

  #stats {
    flex: 0 0 auto; display: flex; gap: 22px; flex-wrap: wrap;
    padding: 7px 12px; background: #0b0e13; border-top: 1px solid #222b35;
    font: 11px/1.4 ui-monospace, Consolas, monospace;
  }
  #stats .k { color: #6e7681; margin-right: 6px; }
  #stats .v { color: #c9d1d9; }
  #stats .pos { color: #26a69a; }
  #stats .neg { color: #f23645; }

  #status {
    flex: 0 0 auto; font: 11px/1.5 ui-monospace, Consolas, monospace;
    color: #6e7681; background: #0b0e13; padding: 3px 8px;
    border-top: 1px solid #222b35; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  #status.bad { color: #ff7b72; background: #2a1113; white-space: pre-wrap; }

  #logwrap { position: absolute; left: 8px; bottom: 118px; width: min(660px, calc(100% - 16px)); }
  #logbar {
    font: 11px/1.6 ui-monospace, Consolas, monospace; color: #8b949e;
    background: rgba(22,27,34,.92); border: 1px solid #26303d;
    border-radius: 6px; padding: 2px 8px; cursor: pointer; user-select: none;
  }
  #log {
    font: 11px/1.55 ui-monospace, Consolas, monospace; color: #7d8590;
    background: rgba(13,17,23,.95); border: 1px solid #26303d; border-top: none;
    border-radius: 0 0 6px 6px; padding: 6px 8px; overflow: auto;
    max-height: 170px; white-space: pre-wrap; word-break: break-all;
  }
  #logwrap.collapsed #log { display: none; }
</style>

<script>
(function () {
  window.__diag = function (msg, isErr) {
    var text = String(msg);
    try { (isErr ? console.error : console.log)(text); } catch (e) {}
    var l = document.getElementById('log');
    if (l) {
      var d = document.createElement('div');
      d.textContent = text;
      if (isErr) d.style.color = '#ff7b72';
      l.appendChild(d);
      l.scrollTop = l.scrollHeight;
    }
    if (isErr) {
      var s = document.getElementById('status');
      if (s) { s.textContent = text; s.className = 'bad'; }
    }
  };
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target !== window && e.target.tagName) {
      window.__diag('✗ 资源加载失败：<' + e.target.tagName.toLowerCase() + '> ' +
        (e.target.src || e.target.href || ''), true);
    } else {
      window.__diag('✗ JS 错误：' + (e && e.message ? e.message : e) +
        (e && e.lineno ? '  @' + e.lineno + ':' + e.colno : ''), true);
    }
  }, true);
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      var s = document.getElementById('status');
      if (s && /^booting/.test(s.textContent)) {
        window.__diag('✗ 2 秒内没启动起来。protocol=' + location.protocol +
          '  typeof EquityChart=' + (typeof EquityChart), true);
      }
    }, 2000);
  });
})();
</script>
</head>
<body>
<div id="app">
  <div id="topbar">
    <select id="sym"></select>
    <span class="sep"></span>
    <label>快线</label><input id="fast" type="number" value="5" min="1" max="120">
    <label>慢线</label><input id="slow" type="number" value="20" min="2" max="250">
    <label>初始资金</label><input id="capital" type="number" value="100000" step="10000">
    <button id="run" class="primary">运行 ▸</button>
    <span class="sep"></span>
    <button id="positions" class="on">持仓色带</button>
    <button id="bysign" class="on">折线按正负</button>
    <button id="theme">浅色</button>
    <button id="test">自检</button>
    <span class="sep"></span>
    <span class="hint">双均线只做多，无手续费/滑点 · 权益按收盘盯市</span>
  </div>

  <div id="chartwrap"><canvas id="chart"></canvas></div>

  <div id="rangebar"></div>

  <div id="stats">
    <span><span class="k">净利</span><span class="v" id="s-net">—</span></span>
    <span><span class="k">最大回撤</span><span class="v" id="s-dd">—</span></span>
    <span><span class="k">交易笔数</span><span class="v" id="s-trades">—</span></span>
    <span><span class="k">胜率</span><span class="v" id="s-win">—</span></span>
    <span><span class="k">末权益</span><span class="v" id="s-eq">—</span></span>
    <span><span class="k">跨度</span><span class="v" id="s-span">—</span></span>
  </div>

  <div id="status">booting…</div>
</div>

<div id="logwrap" class="collapsed">
  <div id="logbar">运行日志（点开）· 始终写入 DOM，供 --dump-dom 抓取</div>
  <div id="log"></div>
</div>

<!-- 顺序不能反：equity 依赖 chart -->
<script src="chart.js"></script>
<script src="grid.js"></script>
<script src="equity.js"></script>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  if (typeof EquityChart !== 'function') {
    window.__diag('✗ 脚本没加载成功（EquityChart=' + (typeof EquityChart) + '）', true);
    return;
  }
  window.__diag('✓ 已加载  protocol=' + location.protocol, false);

  document.getElementById('logbar').addEventListener('click', function () {
    document.getElementById('logwrap').classList.toggle('collapsed');
  });

  var symSel = document.getElementById('sym');
  SYMBOLS.forEach(function (s) {
    var o = document.createElement('option');
    o.value = s.ticker;
    o.textContent = s.ticker + '  ' + s.name;
    symSel.appendChild(o);
  });
  var ticker = SYMBOLS[0].ticker;

  var chart = null;
  var lastBt = null;
  var showPositions = true;
  var themeName = 'dark';

  try {
    chart = new EquityChart('#chart', [], { title: '', colorBySign: true });
    chart.setTheme(themeName);
  } catch (e) {
    window.__diag('✗ 初始化失败：' + (e && e.stack ? e.stack : e), true);
    return;
  }
  window.__eq = chart;

  /* ------------------------------------------------------------ 回测 */
  function run() {
    var fast = parseInt(document.getElementById('fast').value, 10) || 5;
    var slow = parseInt(document.getElementById('slow').value, 10) || 20;
    var capital = parseFloat(document.getElementById('capital').value) || 100000;
    if (slow <= fast) { slow = fast + 1; document.getElementById('slow').value = String(slow); }

    var bars = dailyFor(ticker);
    var t0 = Date.now();
    var bt;
    try {
      bt = simulateMaCross(bars, fast, slow, capital);
    } catch (e) {
      window.__diag('✗ 回测抛异常：' + (e && e.stack ? e.stack : e), true);
      return;
    }
    var ms = Date.now() - t0;
    lastBt = bt;

    chart.setData(bt.points);
    chart.setPositions(showPositions ? bt.positions : []);
    chart.showLast(180);
    chart.drawNow();
    refreshRange();
    renderStats(bt, capital, ms);
    report();
  }
  window.__run = run;

  function fmtV(v, dec) {
    return fmtMoney(v, dec == null ? 2 : dec, true);
  }
  function signCls(v) { return v >= 0 ? 'pos' : 'neg'; }

  function renderStats(bt, capital, ms) {
    var net = bt.netProfit;
    var eq = bt.points.length ? bt.points[bt.points.length - 1].equity : capital;
    var el;
    el = document.getElementById('s-net');
    el.textContent = (net >= 0 ? '+' : '') + fmtV(net) +
      '  (' + (net / capital * 100).toFixed(2) + '%)';
    el.className = 'v ' + signCls(net);

    el = document.getElementById('s-dd');
    el.textContent = fmtV(bt.maxDrawdown);
    el.className = 'v neg';

    document.getElementById('s-trades').textContent = String(bt.tradeCount);

    el = document.getElementById('s-win');
    el.textContent = (bt.winRate * 100).toFixed(1) + '%';
    el.className = 'v ' + signCls(bt.winRate - 0.5);

    el = document.getElementById('s-eq');
    el.textContent = fmtV(eq);
    el.className = 'v ' + signCls(eq - capital);

    var days = bt.points.length ? (bt.points[bt.points.length - 1].time - bt.points[0].time) / 86400000 : 0;
    document.getElementById('s-span').textContent =
      bt.points.length + ' 根 / ' + (days / 365).toFixed(2) + ' 年 · ' + ms + 'ms';

    chart.o.title = ticker + '  MA(' + document.getElementById('fast').value + ',' +
      document.getElementById('slow').value + ')  净利 ' +
      (net >= 0 ? '+' : '') + fmtV(net) + '  最大回撤 ' + fmtV(bt.maxDrawdown);
    chart.invalidate();
  }

  /* ------------------------------------------------------------ 范围条 */
  var rangebar = document.getElementById('rangebar');
  var rangeEls = {};
  RANGES.forEach(function (r) {
    if (r.key === 'ALL') {
      var sp = document.createElement('span');
      sp.className = 'sep';
      rangebar.appendChild(sp);
    }
    var b = document.createElement('button');
    b.textContent = r.label;
    b.dataset.range = r.key;
    rangebar.appendChild(b);
    rangeEls[r.key] = b;
  });
  var rangeInfo = document.createElement('span');
  rangeInfo.id = 'rangeInfo';
  rangeInfo.className = 'hint';
  rangebar.appendChild(rangeInfo);

  rangebar.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button[data-range]') : null;
    if (!b) return;
    chart.setRange(b.dataset.range);
    refreshRange();
  });

  function computeActiveRange(c) {
    var vt = c.viewTimes();
    if (!vt) return null;
    var all = c.points[c.points.length - 1].time - c.points[0].time;
    var span = vt[1] - vt[0];
    if (all > 0 && span >= all * 0.97) return 'ALL';
    var ytd = new Date(new Date(c.points[c.points.length - 1].time).getFullYear(), 0, 1).getTime();
    if (Math.abs(vt[0] - ytd) < 86400000 * 7) return 'YTD';
    var best = null;
    var bestErr = 1e9;
    for (var i = 0; i < RANGES.length; i++) {
      var r = RANGES[i];
      if (r.ms == null) continue;
      var err = Math.abs(Math.log((span || 1) / r.ms));
      if (err < bestErr) { bestErr = err; best = r.key; }
    }
    return bestErr < Math.log(1.6) ? best : null;
  }

  function refreshRange() {
    for (var i = 0; i < RANGES.length; i++) {
      var k = RANGES[i].key;
      rangeEls[k].classList.toggle('off', !chart.rangeAvailable(k));
    }
    var act = computeActiveRange(chart);
    Object.keys(rangeEls).forEach(function (k) {
      rangeEls[k].classList.toggle('on', k === act);
    });
    rangeInfo.textContent = (chart.viewSpan() / 86400000).toFixed(0) + 'd span';
  }

  /* ------------------------------------------------------------ 顶栏 */
  document.getElementById('topbar').addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!btn) return;
    if (btn.id === 'run') {
      run();
    } else if (btn.id === 'positions') {
      showPositions = !showPositions;
      btn.classList.toggle('on', showPositions);
      if (lastBt) chart.setPositions(showPositions ? lastBt.positions : []);
    } else if (btn.id === 'bysign') {
      chart.colorBySign = !chart.colorBySign;
      btn.classList.toggle('on', chart.colorBySign);
      chart.invalidate();
    } else if (btn.id === 'theme') {
      themeName = themeName === 'dark' ? 'light' : 'dark';
      chart.setTheme(themeName);
      btn.textContent = themeName === 'dark' ? '浅色' : '深色';
      btn.classList.toggle('on', themeName === 'light');
    } else if (btn.id === 'test') {
      runTest();
    }
  });
  symSel.addEventListener('change', function () { ticker = symSel.value; run(); });

  function report() {
    statusEl.className = '';
    statusEl.textContent = 'sym=' + ticker + '  | ' + chart.debugInfo();
  }
  window.addEventListener('resize', function () { refreshRange(); report(); });

  /* ------------------------------------------------------------ 自检 */
  function runTest() {
    log('--- 权益图自检 ---');
    var a;
    try {
      a = equitySelfTest(dailyFor(ticker));
    } catch (e) {
      window.__diag('✗ 权益图自检抛异常：' + (e && e.stack ? e.stack : e), true);
      return;
    }
    var tail = 'EQTEST pass=' + a.pass + ' fail=' + a.fail;
    document.title = tail;
    log(tail);
    report();
    return a;
  }
  window.__selftest = runTest;

  /* ------------------------------------------------------------ 启动 */
  try {
    run();
  } catch (e) {
    window.__diag('✗ 启动失败：' + (e && e.stack ? e.stack : e), true);
    return;
  }
  refreshRange();
  report();

  // ⚠️ 加 setTimeout 兜底：后台标签页 / headless 里 rAF 可能不触发
  var started = false;
  function autostart() {
    if (started) return;
    started = true;
    runTest();
    log('READY 权益页就绪');
  }
  requestAnimationFrame(function () { requestAnimationFrame(autostart); });
  setTimeout(autostart, 400);
})();
</script>
</body>
</html>
