<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tv-chart · 左侧纵向绘图工具栏</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; overflow: hidden;
    font: 14px -apple-system, "system-ui", "Trebuchet MS", Roboto, Ubuntu, sans-serif;
    background: #f8f9fa; color: #0f0f0f;
  }
  /* 工具栏挂载点 */
  #sidebar { flex: 0 0 52px; }
  /* 右侧占位图表区 */
  #stage { flex: 1 1 auto; position: relative; overflow: hidden; }
  #stage .hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #b2b2b2; font-size: 13px; letter-spacing: .08em; pointer-events: none;
  }
  /* 状态回显 */
  #state {
    position: absolute; right: 12px; bottom: 12px; padding: 6px 10px;
    background: #fff; border: 1px solid #e0e0e0; border-radius: 6px;
    font: 12px/1.6 ui-monospace, Consolas, monospace; color: #555;
  }
</style>
</head>
<body>
  <div id="sidebar"></div>
  <div id="stage">
    <div class="hint">图表区域占位 —— 左侧纵向绘图工具栏（tv-sidebar）</div>
    <div id="state">悬停带小箭头的按钮会浮现箭头，点击弹出子菜单；事件回显在这里</div>
  </div>

  <script type="module">
    import { createSidebar } from './sidebar.js';

    const state = document.getElementById('state');
    const log = (msg) => { state.textContent = msg; };

    createSidebar(document.getElementById('sidebar'), {
      onTool:   (label) => log(`事件: onTool → ${label}`),
      onToggle: (label, on) => log(`事件: onToggle → ${label} ${on ? '开启' : '关闭'}`),
    });
  </script>
</body>
</html>
